site_name: Axiom Inference Engine
repo_url: https://github.com/StrawberCar/Axiom-Inference-Engine
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/installation.md
      - getting-started/quickstart.md
  - .axim Format:
      - format/spec.md
      - format/why-axim.md
  - CLI Reference:
      - cli/index.md
      - cli/serve.md
      - cli/inspect.md
      - cli/export.md
      - cli/download.md
      - cli/infer.md
      - cli/prepare-data.md
      - cli/sft.md
  - API:
      - api/python.md
      - api/rest.md
  - Web UI: webui.md
  - Fine-tuning:
      - sft/index.md
      - sft/preparing-data.md
      - sft/training.md
      - sft/config-reference.md
  - Development:
      - development/roadmap.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/StrawberCar/Axiom-Inference-Engine
      name: Axiom Inference Engine on GitHub

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: "!!python/name:pymdownx.superfences.fence_code_format"
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
